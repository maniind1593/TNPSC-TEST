<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TNPSC நண்பர்கள் Live Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #0d9488;
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success-bg: #ecfdf5;
    --success-text: #065f46;
    --success-border: #6ee7b7;
    --danger-bg: #fef2f2;
    --danger-text: #991b1b;
    --danger-border: #fca5a5;
    font-family: "Plus Jakarta Sans", "Noto Sans Tamil", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #e0e7ff 0%, var(--bg) 260px);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 36px;
  }

  .wrap { max-width: 740px; margin: auto; padding: 16px; }

  header {
    background: linear-gradient(135deg, #1e1b4b 0%, #1d4ed8 100%);
    color: #fff;
    padding: 24px 20px;
    border-radius: 20px;
    margin: 6px 0 18px;
    box-shadow: 0 12px 28px -8px rgba(29, 78, 216, 0.35);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: "";
    position: absolute;
    right: -30px;
    top: -30px;
    width: 140px;
    height: 140px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
  }
  .badge-top {
    display: inline-block;
    background: rgba(255, 255, 255, 0.16);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 800; line-height: 1.35; }
  header p { margin: 0; font-size: 14px; color: #dbeafe; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin: 14px 0;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05);
    animation: fadeUp 0.28s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h2 { font-size: 18px; margin: 0 0 8px; font-weight: 800; color: #1e293b; }
  .muted { color: var(--muted); font-size: 13.5px; line-height: 1.5; }

  label.field-label {
    display: block;
    font-weight: 700;
    font-size: 13.5px;
    margin: 12px 0 6px;
    color: #334155;
  }

  .code-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 6px;
  }
  .code-label-row label { margin: 0; }

  .slot-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .max-pill {
    background: #eef2ff;
    color: #3730a3;
    border: 1px solid #c7d2fe;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .count-pill {
    background: #ecfdf5;
    color: #065f46;
    border: 1px solid #6ee7b7;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }

  .code-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .code-row input { flex: 1; text-transform: uppercase; font-weight: 700; letter-spacing: 0.6px; }

  input[type=text], input[type=password], input[type=number], select {
    width: 100%;
    padding: 13px 14px;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    background: #f8fafc;
    transition: all 0.2s;
  }
  input[type=text]:focus, input[type=password]:focus, input[type=number]:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }

  .ai-panel {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-top: 12px;
  }

  button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    font: inherit;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button.mini-btn {
    width: auto;
    margin-top: 0;
    padding: 0 14px;
    font-size: 13px;
    border-radius: 11px;
    box-shadow: none;
    white-space: nowrap;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  button.secondary {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    box-shadow: 0 6px 16px -4px rgba(13, 148, 136, 0.4);
  }
  button.outline {
    background: #f1f5f9;
    color: #1e293b;
    border: 1px solid #cbd5e1;
    box-shadow: none;
  }
  button.outline:hover { background: #e2e8f0; }

  .share-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #eff6ff;
    border: 1px dashed #93c5fd;
    padding: 10px 12px;
    border-radius: 12px;
    margin-top: 12px;
    font-size: 13px;
    color: #1e3a8a;
  }

  .exam-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .progress-wrap {
    width: 100%;
    height: 8px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
    margin: 10px 0 16px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #2563eb, #10b981);
    transition: width 0.3s ease;
  }

  .q {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .q-num {
    display: inline-block;
    background: #1e293b;
    color: #fff;
    font-size: 11.5px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .qtitle { font-weight: 700; font-size: 15.5px; line-height: 1.55; color: #0f172a; }
  .qtitle-en { display: block; font-weight: 500; font-size: 13.5px; color: #475569; margin-top: 3px; }

  .opt {
    display: flex;
    gap: 11px;
    align-items: flex-start;
    padding: 11px 12px;
    margin: 8px 0 0;
    background: #fff;
    border: 1.5px solid #e2e8f0;
    border-radius: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .opt:hover { border-color: #93c5fd; background: #f0f7ff; }
  .opt.selected {
    border-color: var(--primary);
    background: #eff6ff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.1);
  }
  .opt input { margin-top: 4px; accent-color: var(--primary); transform: scale(1.15); }
  .opt-letter { font-weight: 800; color: var(--primary); min-width: 20px; }

  .pulse-box { text-align: center; padding: 14px 8px; }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #dbeafe;
    border-top-color: var(--primary);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .winner-box {
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
    border: 1.5px solid var(--success-border);
    color: var(--success-text);
    padding: 16px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 17.5px;
    text-align: center;
    margin-bottom: 16px;
  }
  .score-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
  }
  .score-tile {
    background: #f8fafc;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .score-tile.top { background: #eff6ff; border-color: #93c5fd; }
  .score-big { font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 4px; }

  .review-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
  }
  .pill-good {
    display: inline-block;
    background: var(--success-bg);
    color: var(--success-text);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
  }
  .pill-bad {
    display: inline-block;
    background: var(--danger-bg);
    color: var(--danger-text);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font
