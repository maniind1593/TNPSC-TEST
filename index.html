<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">

<title>TNPSC Live Quiz</title>
<style>

  button.wa { background: #16a34a; }

  .hidden { display: none; }
  .err { color: #dc2626; font-weight: 700; margin-top: 8px; }
  .ok { color: #059669; font-weight: 700; margin-top: 8px; }
  .q { background: #f8fafc; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; }

  .champ { background: #fef08a; color: #713f12; animation: pop 1s infinite alternate; }

  .imp { background: #fee2e2; color: #7f1d1d; }

</head>

<div class="box hidden" id="examBox">

  <div id="examMsg" class="err"></div>
</div>

<div class="box hidden" id="waitBox">

</div>

<div class="box hidden" id="resBox">

  <div class="row">

  <div id="shareMsg" class="ok"></div>
  <div id="reviewArea" style="margin-top:12px;"></div>

<div class="box" id="adminBox">

  <label>Subject (பாடம்)</label>
  <select id="subj" onchange="changeSubject()">
    <option value="Indian Polity">Indian Polity</option>
    <option value="Indian National Movement">Indian National Movement</option>
    <option value="History and Culture of Tamil Nadu">TN History &amp; Culture</option>
    <option value="Geography of India">Geography</option>
    <option value="Indian Economy">Indian Economy</option>
    <option value="General Science">General Science</option>
  </select>

    <option value="10" selected>10 கேள்விகள்</option>
    <option value="20">20 கேள்விகள்</option>
    <option value="25">25 கேள்விகள்</option>
  </select>

function getTodayDateKey() {
  var now = new Date();
  var yyyy = now.getFullYear();
  var mm = String(now.getMonth() + 1).padStart(2, "0");
  var dd = String(now.getDate()).padStart(2, "0");
  return yyyy + "-" + mm + "-" + dd;
}

function createSeedNumber(text) {
  var hash = 2166136261;
  for (var i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function nextRand(stateObj) {
  stateObj.seed = (Math.imul(stateObj.seed, 1664525) + 1013904223) >>> 0;
  return stateObj.seed;
}

  var cleanSubj = SUBJECT_TEMPLATES[subject] ? subject : "Indian Polity";
  var cleanBatch = String(batchCode || "TNPSC01").trim().toUpperCase();
  var dayKey = getTodayDateKey();
  var state = { seed: createSeedNumber(dayKey + "|" + cleanSubj + "|" + cleanBatch) };
  var templates = SUBJECT_TEMPLATES[cleanSubj];
  var generated = [];

  for (var idx = 0; idx < qLimit; idx++) {
    var pickIdx = nextRand(state) % templates.length;
    var tpl = templates[pickIdx];
    var cycleNum = Math.floor(idx / templates.length) + 1;

    var options = [tpl.correct].concat(tpl.wrong.slice());
    for (var i = options.length - 1; i > 0; i--) {
      var j = nextRand(state) % (i + 1);
      var temp = options[i];
      options[i] = options[j];
      options[j] = temp;
    }

    var answerIndex = options.indexOf(tpl.correct);
    generated.push({
      q: tpl.prompt(cycleNum + "-" + (idx + 1)),
      opts: options,
      a: answerIndex >= 0 ? answerIndex : 0,
      why: tpl.why + " (" + dayKey + " • " + cleanBatch + ")"
    });
  }

  return generated;
}

var qs = buildDailyQuestionsForSubject("Indian Polity", "TNPSC01", 10);
var sb = null, me = null, myAns = [], myScore = 0, timer = null;

function g(id){ return document.getElementById(id); }
function show(id){ g(id).classList.remove("hidden"); }
function hide(id){ g(id).classList.add("hidden"); }

function getSB(){
  if (sb) return sb;
  var cfg = window.QUIZ_CONFIG || {};
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY || !window.supabase) return null;
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  return sb;
}

function refreshSubjectBatchQuestions(){
  var subj = g("subj") ? g("subj").value : "Indian Polity";
  var batch = g("code") ? g("code").value.trim().toUpperCase() : "TNPSC01";
  var countVal = g("qCount") ? Number(g("qCount").value) || 10 : 10;
  qs = buildDailyQuestionsForSubject(subj, batch, countVal);
  if (g("aiMsg")){
    g("aiMsg").className = "ok";
    g("aiMsg").textContent = getTodayDateKey() + " | " + subj + " | Batch: " + batch + " (" + qs.length + " Q&A தயார்)";
  }
}

function changeSubject(){
  refreshSubjectBatchQuestions();
}

function onProviderChange(){
  var prov = g("aiProvider").value;
  var cfgModel = (window.QUIZ_CONFIG && window.QUIZ_CONFIG.GEMINI_MODEL) || "gemini-3.8-flash";
  if (prov === "openai"){
    g("keyLabel").textContent = "ChatGPT / OpenAI API Key (sk-...)";
    g("gkey").placeholder = "sk-... (OpenAI API Key உள்ளிடவும்)";
    if (!g("aiModel").value.trim() || g("aiModel").value.indexOf("gemini") === 0){
      g("aiModel").value = "gpt-4o-mini";
    }
  } else {
    g("keyLabel").textContent = "Gemini API Key (AIza...)";
    g("gkey").placeholder = "AIza... (Gemini API Key உள்ளிடவும்)";
    g("aiModel").value = cfgModel;
  }
}

function extractJsonArray(rawText){
  var clean = String(rawText || "").replace(/```json|```/gi, "").trim();
  var start = clean.indexOf("[");
  var end = clean.lastIndexOf("]");
  if (start !== -1 && end !== -1 && end > start){
    clean = clean.slice(start, end + 1);
  }
  return JSON.parse(clean);
}

async function fetchWithRetry(url, options, retries){
  for (var attempt = 0; attempt <= retries; attempt++){
    var r = await fetch(url, options);
    var d = await r.json();
    if (r.ok) return d;
    var msg = (d && d.error && d.error.message) || "API Error";
    var busy = msg.toLowerCase().indexOf("high demand") !== -1 ||
      msg.toLowerCase().indexOf("overloaded") !== -1 ||
      msg.toLowerCase().indexOf("rate limit") !== -1 ||
      r.status === 503 || r.status === 429;
    if (!busy || attempt === retries) throw new Error(msg);
    g("aiMsg").className = "ok";
    g("aiMsg").textContent = "AI server busy-ஆக உள்ளது, மீண்டும் முயற்சிக்கிறது (" + (attempt + 1) + ")...";
    await new Promise(function(res){ setTimeout(res, 1500 * (attempt + 1)); });
  }
}

async function callOpenAI(apiKey, model, prompt){
  var d = await fetchWithRetry("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + apiKey
    },
    body: JSON.stringify({
      model: model || "gpt-4o-mini",
      temperature: 0.8,
      messages: [
        { role: "system", content: "You are a TNPSC quiz generator. Return ONLY a valid JSON array." },
        { role: "user", content: prompt }
      ]
    })
  }, 2);
  return d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content || "[]";
}

async function callGemini(apiKey, model, prompt){
  var cleanModel = String(model || "gemini-3.8-flash").replace(/^models\//, "");
  var endpoint = "https://generativelanguage.googleapis.com/v1beta/models/" +
    encodeURIComponent(cleanModel) + ":generateContent?key=" + encodeURIComponent(apiKey);
  var d = await fetchWithRetry(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { responseMimeType: "application/json", temperature: 0.8 }
    })
  }, 2);
  return d && d.candidates && d.candidates[0] && d.candidates[0].content &&
    d.candidates[0].content.parts && d.candidates[0].content.parts[0] &&
    d.candidates[0].content.parts[0].text || "[]";
}

async function genAI(newCode){
  var cfg = window.QUIZ_CONFIG || {};
  var pin = g("pin").value.trim();
  var expected = String(cfg.ADMIN_PIN || "Admin2026").trim();
  if (!pin || pin !== expected){
    g("aiMsg").className = "err";
    g("aiMsg").textContent = "சரியான Admin PIN உள்ளிடவும்.";
    return;
  }
  if (newCode){
    g("code").value = "TNP" + Math.floor(100 + Math.random()*900);
    refreshSubjectBatchQuestions();
  }
  var key = g("gkey").value.trim();
  if (!key){
    g("aiMsg").className = "err";
    g("aiMsg").textContent = "AI API Key உள்ளிடவும் (அல்லது தினசரி Subject/Batch Q&A தயாராக உள்ளது).";
    return;
  }
  var code = g("code").value.trim().toUpperCase();
  var s = g("subj").value;
  var prov = g("aiProvider").value;
  var model = g("aiModel").value.trim();
  var qLimit = g("qCount") ? Number(g("qCount").value) || 10 : 10;

  g("aiBtn1").disabled = true;
  g("aiBtn2").disabled = true;
  g("aiMsg").className = "ok";
  g("aiMsg").textContent = (prov === "openai" ? "ChatGPT" : "Gemini") + " மூலம் புதிய கேள்விகள் உருவாக்குகிறது...";

  var prompt = 'Create ' + qLimit + ' fresh TNPSC multiple-choice questions on "' + s + '" for batch "' + code + '" on ' + getTodayDateKey() + '. ' +
    'Return ONLY a JSON array in this exact format: [{"q":"...","opts":["A","B","C","D"],"a":0,"why":"..."}]';

  try {
    var raw = prov === "openai"
      ? await callOpenAI(key, model || "gpt-4o-mini", prompt)
      : await callGemini(key, model || cfg.GEMINI_MODEL || "gemini-3.8-flash", prompt);

    var arr = extractJsonArray(raw);
    if (!Array.isArray(arr) || !arr.length) throw new Error("கேள்விகள் பட்டியல் வரவில்லை.");

    qs = arr;
    var client = getSB();
    if (client) await client.rpc("quiz_save_questions", { p_test_code: code, p_questions: qs });

    g("aiMsg").className = "ok";
    g("aiMsg").textContent = code + " க்கு " + qs.length + " புதிய AI கேள்விகள் தயார்!";
  } catch(e){
    refreshSubjectBatchQuestions();
    g("aiMsg").className = "err";
    g("aiMsg").textContent = e.message + " (தினசரி Subject/Batch கேள்விகள் load செய்யப்பட்டுள்ளன.)";
  } finally {
    g("aiBtn1").disabled = false;
    g("aiBtn2").disabled = false;
  }
}

async function joinQuiz(){
  refreshSubjectBatchQuestions();
  g("joinMsg").textContent = "";
  var name = g("name").value.trim();
  var code = g("code").value.trim().toUpperCase();
  g("code").value = code;
  if (!name || code.length < 3){
    g("joinMsg").textContent = "பெயர் மற்றும் Test Batch / Code உள்ளிடவும்.";
    return;
  }
  var client = getSB();
  if (!client){
    g("joinMsg").textContent = "config.js சரிபார்க்கவும்.";
    return;
  }
  var saved = await client.rpc("quiz_get_questions", { p_test_code: code });
  if (!saved.error && Array.isArray(saved.data) && saved.data.length) qs = saved.data;

  var res = await client.rpc("quiz_join", { p_test_code: code, p_name: name, p_max_players: 50 });
  if (res.error){
    g("joinMsg").textContent = res.error.message;
    return;
  }
  me = res.data;
  g("whoTitle").textContent = name + " (" + code + ")";
  renderQ();
  hide("joinBox");
  show("examBox");
}

function renderQ(){
  var h = "";
  for (var i = 0; i < qs.length; i++){
    h += '<div class="q"><b>' + (i+1) + '. ' + qs[i].q + '</b>';
    for (var j = 0; j < qs[i].opts.length; j++){
      h += '<label class="opt"><input type="radio" name="q' + i + '" value="' + j + '"> ' + qs[i].opts[j] + '</label>';
    }
    h += '</div>';
  }
  g("qArea").innerHTML = h;
}

async function submitQuiz(){
  g("examMsg").textContent = "";
  var arr = [], sc = 0;
  for (var i = 0; i < qs.length; i++){
    var el = document.querySelector('input[name="q' + i + '"]:checked');
    if (!el){ g("examMsg").textContent = "அனைத்து கேள்விகளுக்கும் பதில் அளிக்கவும்."; return; }
    var v = Number(el.value);
    arr.push(v);
    if (v === qs[i].a) sc++;
  }
  myAns = arr;
  myScore = sc;
  var client = getSB();
  var res = await client.rpc("quiz_submit", {
    p_test_code: g("code").value.trim().toUpperCase(),
    p_participant_id: me.participant_id,
    p_token: me.token,
    p_answers: arr
  });
  if (res.error){ g("examMsg").textContent = res.error.message; return; }
  hide("examBox");
  show("waitBox");
  await checkStatus();
  if (!g("waitBox").classList.contains("hidden")){
    timer = setInterval(checkStatus, 3000);
  }
}

async function checkStatus(){
  var client = getSB();
  var res = await client.rpc("quiz_status", {
    p_test_code: g("code").value.trim().toUpperCase(),
    p_participant_id: me ? me.participant_id : null
  });
  if (res.error) return;
  if (res.data && res.data.released){
    if (timer) clearInterval(timer);
    showResult(res.data);
    hide("waitBox");
    show("resBox");
  } else {
    g("waitText").textContent = "சமர்ப்பித்தவர்கள்: " + (res.data.submitted_count || 0) + " / " + (res.data.total_players || 2);
  }
}

function showResult(d){
  var sc = typeof d.my_score === "number" ? d.my_score : myScore;
  var rank = d.rank || 1;
  var tot = d.total_players || 1;
  var b = g("banner");
  b.className = "banner";
  if (sc > 8){ b.classList.add("champ"); b.textContent = "🏆 CHAMPION! (" + sc + "/" + qs.length + ")"; }
  else if (sc > 5){ b.classList.add("good"); b.textContent = "👏 GOOD! (" + sc + "/" + qs.length + ")"; }
  else { b.classList.add("imp"); b.textContent = "📚 இன்னும் improve பண்ணனும் (" + sc + "/" + qs.length + ")"; }

  g("statsText").textContent = "உங்கள் மதிப்பெண்: " + sc + "/" + qs.length + " | உங்கள் Position: #" + rank + " / " + tot;

  var rv = "";
  for (var i = 0; i < qs.length; i++){
    var ok = myAns[i] === qs[i].a;
    rv += '<div class="q"><b>' + (i+1) + '. ' + qs[i].q + '</b><br>' +
      (ok ? '<span class="ok">சரி</span>' : '<span class="err">தவறு</span>') +
      ' — சரியான பதில்: <b>' + qs[i].opts[qs[i].a] + '</b><br><small>' + (qs[i].why || "") + '</small></div>';
  }
  g("reviewArea").innerHTML = rv;
}

function inviteText(){
  var c = g("code").value.trim().toUpperCase();
  var u = location.href.split("?")[0] + "?code=" + encodeURIComponent(c);
  return "TNPSC Live Quiz!\nBatch / Code: " + c + "\nJoin: " + u;
}

function shareWA(){
  window.open("https://wa.me/?text=" + encodeURIComponent(inviteText()), "_blank");
}

async function shareSocial(){
  var t = inviteText();
  if (navigator.share){
    try { await navigator.share({ title: "TNPSC Quiz", text: t }); return; } catch(e){}
  }
  try { await navigator.clipboard.writeText(t); g("shareMsg").textContent = "Invite Copy செய்யப்பட்டது!"; }
  catch(e){ g("shareMsg").textContent = t; }
}

refreshSubjectBatchQuestions();
